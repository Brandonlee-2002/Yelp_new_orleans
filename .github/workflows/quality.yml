name: quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
      - uses: r-lib/actions/setup-renv@v2
      - name: Run repository tests
        run: Rscript tests/test_pipeline.R
      - name: Check generated files are present
        run: |
          test -f data/analysis/top_10_restaurants.csv
          test -f data/analysis/bootstrap_ward_uncertainty.csv
          test -f docs/index.html
