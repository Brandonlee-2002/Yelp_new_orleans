<script>
(() => {
  'use strict';
  if (!document.body.classList.contains('story-page')) return;
  const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
  const button = document.getElementById('story-motion-toggle');
  const links = Array.from(document.querySelectorAll('.story-chapters a'));
  const chapters = links.map(link => document.getElementById(link.hash.slice(1)));
  const supported = typeof Element.prototype.animate === 'function' && 'IntersectionObserver' in window;
  const running = new Set();
  const seen = new WeakSet();
  let enabled = supported && !preference.matches;
  let queued = false;
  let observer;

  // Contents and numeric values remain static; animation only decorates entry.
  const targets = Array.from(document.querySelectorAll(
    'main.content h2, .baseline-card, .standout-card, .story-takeaway, ' +
    '.scenario-tile, .story-conclusion > div, main.content figure, .funnel-bar'
  ));
  const tiles = Array.from(document.querySelectorAll('.scenario-tile'));
  const cards = Array.from(document.querySelectorAll('.standout-card'));
  const bars = Array.from(document.querySelectorAll('.funnel-bar'));
  const baselines = Array.from(document.querySelectorAll('.baseline-card'));
  function cancelMotion() {
    running.forEach(animation => animation.cancel());
    running.clear();
  }
  function reveal(element) {
    if (!enabled || seen.has(element)) return;
    seen.add(element);
    if (observer) observer.unobserve(element);
    const chapter = element.closest('section.level2')?.id || '';
    let frames = [{ opacity: 0 }, { opacity: 1 }];
    let duration = 460;
    let delay = 0;
    let style = 'quiet-fade';
    if (element.classList.contains('funnel-bar')) {
      // 01: growth along the quantitative axis; labels always show final counts.
      style = 'selection-growth';
      frames = [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }];
      duration = 950;
      delay = Math.max(0, bars.indexOf(element)) * 110;
    } else if (element.classList.contains('baseline-card')) {
      // 02: opposing directions distinguish the two scoring habits.
      style = 'reviewer-comparison';
      const direction = baselines.indexOf(element) % 2 === 0 ? -1 : 1;
      frames = [{ opacity: 0, transform: `translateX(${direction * 24}px)` },
                { opacity: 1, transform: 'translateX(0)' }];
      duration = 650;
    } else if (element.classList.contains('standout-card')) {
      // 03: a small, staggered card deal introduces the three standouts.
      style = 'standout-deal';
      const index = Math.max(0, cards.indexOf(element));
      frames = [{ opacity: 0, transform: `translateY(25px) rotate(${index % 2 ? 1.2 : -1.2}deg)` },
                { opacity: 1, transform: 'translateY(-3px) rotate(0deg)', offset: .82 },
                { opacity: 1, transform: 'translateY(0) rotate(0deg)' }];
      duration = 720;
      delay = index * 130;
    } else if (chapter === 'put-the-shortlist-on-the-map' && element.tagName === 'FIGURE') {
      // 04: open an aperture over the intact static map; no locations move.
      style = 'map-aperture';
      frames = [{ opacity: .3, clipPath: 'inset(44% 44% 44% 44% round 12px)' },
                { opacity: 1, clipPath: 'inset(0% 0% 0% 0% round 0px)' }];
      duration = 1050;
    } else if (element.classList.contains('scenario-tile')) {
      // 05: a row-by-row hinge reveal makes the sensitivity comparisons distinct.
      style = 'scenario-hinge';
      const index = Math.max(0, tiles.indexOf(element));
      frames = [{ opacity: 0, transform: 'perspective(900px) rotateX(-28deg)', transformOrigin: 'top' },
                { opacity: 1, transform: 'perspective(900px) rotateX(0deg)', transformOrigin: 'top' }];
      duration = 620;
      delay = Math.floor(index / 2) * 85 + (index % 2) * 55;
    } else if (chapter === 'the-top-15' && element.tagName === 'FIGURE') {
      frames = [{ opacity: .3, clipPath: 'inset(0% 100% 0% 0%)' },
                { opacity: 1, clipPath: 'inset(0% 0% 0% 0%)' }];
      style = 'ranking-wipe';
      duration = 850;
    }
    element.dataset.motionStyle = style;
    const animation = element.animate(frames, {
      duration, delay,
      easing: 'cubic-bezier(.2,.7,.25,1)', fill: 'backwards'
    });
    running.add(animation);
    animation.onfinish = animation.oncancel = () => running.delete(animation);
  }
  function revealVisible() {
    targets.forEach(element => {
      const box = element.getBoundingClientRect();
      if (box.bottom > 0 && box.top < window.innerHeight * .94) reveal(element);
    });
  }
  function setMotion(value) {
    enabled = supported && value;
    document.body.dataset.motion = enabled ? 'on' : 'off';
    if (button) {
      button.textContent = enabled ? 'Motion: on' : 'Motion: off';
      button.setAttribute('aria-pressed', String(enabled));
    }
    if (!enabled) cancelMotion();
    else revealVisible();
  }
  if (supported) {
    observer = new IntersectionObserver(entries => {
      entries.forEach(entry => { if (entry.isIntersecting) reveal(entry.target); });
    }, { threshold: .14, rootMargin: '0px 0px -24px 0px' });
    targets.forEach(element => observer.observe(element));
    if (button) {
      button.addEventListener('click', () => setMotion(!enabled));
      button.hidden = false;
    }
  }
  const progress = document.createElement('div');
  progress.className = 'story-reading-progress';
  progress.setAttribute('aria-hidden', 'true');
  const fill = document.createElement('span');
  progress.appendChild(fill);
  document.body.appendChild(progress);
  function updateReadingPosition() {
    queued = false;
    const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
    const fraction = Math.max(0, Math.min(1, window.scrollY / max));
    fill.style.transform = `scaleX(${fraction})`;
    let active = 0;
    chapters.forEach((chapter, index) => {
      if (chapter && chapter.getBoundingClientRect().top <= window.innerHeight * .28) active = index;
    });
    links.forEach((link, index) => {
      if (index === active) link.setAttribute('aria-current', 'step');
      else link.removeAttribute('aria-current');
    });
  }
  function scheduleUpdate() {
    if (!queued) { queued = true; window.requestAnimationFrame(updateReadingPosition); }
  }
  window.addEventListener('scroll', scheduleUpdate, { passive: true });
  window.addEventListener('resize', scheduleUpdate, { passive: true });
  window.addEventListener('load', scheduleUpdate, { once: true });
  window.addEventListener('pagehide', cancelMotion);
  const changedPreference = () => setMotion(!preference.matches);
  if (preference.addEventListener) preference.addEventListener('change', changedPreference);
  else if (preference.addListener) preference.addListener(changedPreference);
  setMotion(enabled);
  updateReadingPosition();
})();
</script>
